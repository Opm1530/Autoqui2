server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Assets estáticos (JS/CSS com hash no nome, imagens, sons, fontes):
    # podem ser cacheados por muito tempo — o hash muda a cada build.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|mp3|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # HTML e rotas do SPA: NUNCA cacheia — assim o navegador sempre pega o
    # index.html novo (que aponta pros assets novos) sem precisar de Ctrl+Shift+R.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
