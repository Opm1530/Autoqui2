# ─────────────────────────────────────────────────────────────────────────────
# Detecta crawlers de PREVIEW de link (WhatsApp, Instagram, etc.). Eles não rodam
# JavaScript, então recebem o HTML já com as meta tags do cliente (og:image =
# logo, favicon, título) vindo do backend. Usuário comum recebe o SPA normal.
# (Este arquivo vai para /etc/nginx/conf.d/default.conf → contexto http, onde
#  a diretiva `map` é válida.)
# ─────────────────────────────────────────────────────────────────────────────
map $http_user_agent $is_crawler {
    default 0;
    "~*(facebookexternalhit|facebot|WhatsApp|Twitterbot|Instagram|TelegramBot|LinkedInBot|Slackbot|Discordbot|Pinterest|redditbot|Googlebot|bingbot|Applebot|vkShare|SkypeUriPreview|Embedly|W3C_Validator)" 1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # DNS interno do Docker — necessário porque o proxy_pass abaixo usa variáveis
    # (query dinâmica), o que faz o nginx resolver o backend em tempo de execução.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Cabeçalhos repassados quando fazemos proxy pro backend (só valem no proxy).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Assets estáticos (JS/CSS com hash, imagens, sons, fontes): cache longo.
    # Sempre estáticos — inclusive para crawlers (nunca vão pro backend).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|mp3|woff2?|webp|avif|txt|xml|json|map)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Documentos de LOJA: se for crawler, entrega o HTML com a marca do cliente;
    #    senão, o SPA normal. O HTML nunca é cacheado (edições aparecem no reload). ──

    # Raiz (usada pelos subdomínios de loja/landing/links).
    location = / {
        if ($is_crawler) {
            proxy_pass http://autoqui-api:3005/api/storefront/html?host=$host&path=$uri;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Catálogo/vitrine por caminho: /catalog/:storeId
    location ^~ /catalog/ {
        if ($is_crawler) {
            proxy_pass http://autoqui-api:3005/api/storefront/html?host=$host&path=$uri;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Página de links por caminho: /links/:storeId
    location ^~ /links/ {
        if ($is_crawler) {
            proxy_pass http://autoqui-api:3005/api/storefront/html?host=$host&path=$uri;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Demais rotas do SPA (painel, login, etc.) — sempre o index.html, sem cache.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
